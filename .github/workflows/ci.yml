name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every referenced site asset resolves
        run: |
          cd site
          fail=0
          for f in $(grep -oE '(src|href)="[^"]+"' index.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -vE '^(#|https?:|mailto:)'); do
            if [ ! -e "$f" ]; then echo "MISSING: $f"; fail=1; fi
          done
          exit $fail
