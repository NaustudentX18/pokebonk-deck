<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokéBonk Deck</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="menu">
    <h1>PokéBonk Deck</h1>
    <ul id="items"></ul>
    <p class="hint">unofficial client · pokebonk.com</p>
  </div>
  <script>
    const ITEMS = [
      { id: 'resume', label: 'Resume', shortcut: 'Esc' },
      { id: 'fullscreen', label: 'Toggle fullscreen', shortcut: 'F11' },
      { id: 'reload', label: 'Reload game', shortcut: 'F5' },
      { id: 'gamepad-status', label: 'Controller status', shortcut: 'F8' },
      { id: 'quit', label: 'Quit', shortcut: 'Ctrl+Q' }
    ]

    const list = document.getElementById('items')
    let selectedIndex = 0
    const listItems = []

    for (let i = 0; i < ITEMS.length; i++) {
      const item = ITEMS[i]
      const li = document.createElement('li')
      li.tabIndex = 0
      const label = document.createElement('span')
      label.textContent = item.label
      const kbd = document.createElement('kbd')
      kbd.textContent = item.shortcut
      li.append(label, kbd)
      li.addEventListener('click', () => console.log('deck-command:' + item.id))
      li.addEventListener('mouseenter', () => setFocus(i))
      list.append(li)
      listItems.push(li)
    }

    function setFocus(idx) {
      selectedIndex = (idx + ITEMS.length) % ITEMS.length
      listItems.forEach((li, i) => {
        if (i === selectedIndex) {
          li.classList.add('selected')
          li.focus()
        } else {
          li.classList.remove('selected')
        }
      })
    }

    setFocus(0)

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        console.log('deck-command:resume')
      } else if (e.key === 'ArrowDown') {
        e.preventDefault()
        setFocus(selectedIndex + 1)
      } else if (e.key === 'ArrowUp') {
        e.preventDefault()
        setFocus(selectedIndex - 1)
      } else if (e.key === 'Enter') {
        e.preventDefault()
        console.log('deck-command:' + ITEMS[selectedIndex].id)
      }
    })
  </script>
</body>
</html>
