<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="appBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#231b42"/>
      <stop offset="100%" stop-color="#0c0918"/>
    </radialGradient>
    <radialGradient id="appGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="pbWhite" cx="35%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="pbMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <clipPath id="pbClip512">
      <circle cx="256" cy="256" r="190"/>
    </clipPath>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#433570" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Background Ambience -->
  <circle cx="256" cy="256" r="230" fill="url(#appGlow)"/>

  <!-- Poké Ball with Drop Shadow -->
  <g filter="url(#ballShadow)">
    <circle cx="256" cy="256" r="194" fill="#0f1118"/>

    <g clip-path="url(#pbClip512)">
      <!-- Top Half (Red) -->
      <path d="M 66 256 A 190 190 0 0 1 446 256 Z" fill="url(#pbRed)"/>
      <path d="M 100 220 C 120 145 180 95 260 95 C 290 95 320 102 345 115 C 318 108 280 105 245 112 C 175 122 120 168 100 220 Z" fill="#ffffff" opacity="0.4"/>
      <ellipse cx="180" cy="145" rx="30" ry="14" transform="rotate(-30 180 145)" fill="#ffffff" opacity="0.35"/>

      <!-- Bottom Half (White) -->
      <path d="M 66 256 A 190 190 0 0 0 446 256 Z" fill="url(#pbWhite)"/>
      <path d="M 66 256 A 190 190 0 0 0 446 256 Q 256 290 66 256 Z" fill="#0f172a" opacity="0.15"/>

      <!-- Equator -->
      <rect x="66" y="242" width="380" height="28" fill="#0f1118"/>
    </g>

    <!-- Center Mechanism -->
    <circle cx="256" cy="256" r="66" fill="#0f1118"/>
    <circle cx="256" cy="256" r="52" fill="url(#pbMetal)"/>
    <circle cx="256" cy="256" r="44" fill="#0f172a"/>
    <circle cx="256" cy="256" r="35" fill="#ffffff"/>
    <circle cx="256" cy="256" r="20" fill="#f8fafc"/>
    <circle cx="256" cy="256" r="12" fill="#38bdf8"/>
  </g>
</svg>