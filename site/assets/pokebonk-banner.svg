<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e1842" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#100b24" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="blueNebula" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redNebula" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldNebula" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Poké Text Gradients -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="25%" stop-color="#ffd500"/>
      <stop offset="60%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#e68500"/>
    </linearGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="deckBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Poké Ball Gradients -->
    <radialGradient id="ballRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="ballWhite" cx="35%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="ballMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bannerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Banner Base Plate -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGlow)"/>
  <rect width="1200" height="380" rx="24" fill="url(#gridPattern)"/>

  <!-- Colored Ambience -->
  <circle cx="240" cy="120" r="280" fill="url(#blueNebula)"/>
  <circle cx="960" cy="120" r="280" fill="url(#redNebula)"/>
  <circle cx="600" cy="190" r="220" fill="url(#goldNebula)"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="none" stroke="#2c2350" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="364" rx="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Speed Lines & Tech Geometry -->
  <g opacity="0.18">
    <path d="M 60 70 L 220 70 L 260 110 L 60 110 Z" fill="#38bdf8"/>
    <path d="M 1140 310 L 980 310 L 940 270 L 1140 270 Z" fill="#ef4444"/>
    <line x1="120" y1="20" x2="160" y2="20" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <line x1="1040" y1="360" x2="1080" y2="360" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#181335" stroke="#433570" stroke-width="1.5"/>
    <circle cx="-144" cy="0" r="5" fill="#10b981" filter="url(#neonGlow)"/>
    <text x="8" y="5" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">STEAM DECK · VERIFIED NATIVE</text>
  </g>

  <!-- Main Center Crest Group -->
  <g transform="translate(600, 185)" filter="url(#bannerShadow)">
    
    <!-- Central Poké Ball Emblem -->
    <g transform="translate(-400, 0)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="76" fill="#0b0816"/>
      <circle cx="0" cy="0" r="72" fill="#15171e"/>

      <!-- Ball Halves -->
      <g clip-path="url(#centerClip)">
        <clipPath id="centerClip">
          <circle cx="0" cy="0" r="70"/>
        </clipPath>
        <!-- Top Half -->
        <path d="M -70 0 A 70 70 0 0 1 70 0 Z" fill="url(#ballRed)"/>
        <!-- Specular -->
        <path d="M -50 -20 C -40 -50 0 -65 35 -55 C 10 -58 -25 -45 -40 -20 Z" fill="#ffffff" opacity="0.4"/>
        <ellipse cx="-20" cy="-35" rx="12" ry="6" transform="rotate(-25 -20 -35)" fill="#ffffff" opacity="0.3"/>
        <!-- Bottom Half -->
        <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="url(#ballWhite)"/>
        <!-- Divider -->
        <rect x="-70" y="-8" width="140" height="16" fill="#15171e"/>
      </g>

      <!-- Center Button Assembly -->
      <circle cx="0" cy="0" r="26" fill="#15171e"/>
      <circle cx="0" cy="0" r="20" fill="url(#ballMetal)"/>
      <circle cx="0" cy="0" r="16" fill="#0f172a"/>
      <circle cx="0" cy="0" r="12" fill="#ffffff"/>
      <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.8" filter="url(#neonGlow)"/>
    </g>

    <!-- Stylized 3D Text Typography: POKÉBONK -->
    <g transform="translate(-290, 24)">
      <!-- 3D Shadow Layers (Extrusions) -->
      <text x="4" y="6" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="#080718">POKÉBONK</text>
      <text x="3" y="4.5" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="#172554">POKÉBONK</text>
      <text x="2" y="3" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="#1d4ed8">POKÉBONK</text>
      <text x="1" y="1.5" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="#2563eb">POKÉBONK</text>

      <!-- Outer Bevel Stroke -->
      <text x="0" y="0" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linejoin="round">POKÉBONK</text>
      <text x="0" y="0" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round">POKÉBONK</text>

      <!-- Front Face Fill -->
      <text x="0" y="0" font-family="Impact, Montserrat, system-ui, sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="4" fill="url(#goldFace)">POKÉBONK</text>

      <!-- DECK / EDITION Sub-Pill -->
      <g transform="translate(540, -4)">
        <rect x="0" y="-38" width="136" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
        <text x="68" y="-12" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#38bdf8" text-anchor="middle" letter-spacing="2">DECK</text>
      </g>
    </g>

  </g>

  <!-- Bottom Feature Ribbon -->
  <g transform="translate(600, 316)" text-anchor="middle">
    <!-- Feature Pills -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#140f2b" stroke="#2c2350" stroke-width="1"/>
      <circle cx="-75" cy="0" r="4" fill="#38bdf8"/>
      <text x="8" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STEAM INPUT NATIVE</text>
    </g>
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#140f2b" stroke="#2c2350" stroke-width="1"/>
      <circle cx="-75" cy="0" r="4" fill="#10b981"/>
      <text x="8" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">1280×800 · 60 FPS</text>
    </g>
    <g transform="translate(120, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#140f2b" stroke="#2c2350" stroke-width="1"/>
      <circle cx="-75" cy="0" r="4" fill="#facc15"/>
      <text x="8" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AUTO-SYNC BUILDS</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#140f2b" stroke="#2c2350" stroke-width="1"/>
      <circle cx="-75" cy="0" r="4" fill="#ec4899"/>
      <text x="8" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PERSISTENT CLOUD</text>
    </g>
  </g>
</svg>